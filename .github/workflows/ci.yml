name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-latest
    env:
      JOBSRADAR_TEST_PYTHON: ${{ github.workspace }}/.ci-venv/bin/python
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: cd prototypes/ui && bun install --frozen-lockfile
      - run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install --disable-pip-version-check httpx==0.28.1
      - run: bun run check:ci
